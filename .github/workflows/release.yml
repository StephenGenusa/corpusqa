# Builds the desktop app on Linux, Windows and macOS and, for a version tag,
# publishes a GitHub release with the installers.
#
#   git tag v0.1.0 && git push origin v0.1.0     # build and release
#   Actions -> Release -> Run workflow           # build only (artifacts)
#
# PyInstaller does not cross-compile, so each OS builds its own backend.
# Nothing is code-signed; packaging/release-notes.md tells users how to open
# an unsigned app on each OS.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04: an older glibc, so the AppImage runs on more distributions.
          - { name: linux, os: ubuntu-22.04 }
          - { name: windows, os: windows-2022 }
          # Apple silicon; PyTorch no longer ships Intel macOS wheels.
          - { name: macos, os: macos-14 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        if: runner.os == 'Linux'
        # The build needs about 10 GB; the image ships with less free.
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Check the tag matches the versions
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          want="${GITHUB_REF_NAME#v}"
          py=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)
          js=$(node -p "require('./gui/package.json').version")
          echo "tag $want, pyproject $py, gui/package.json $js"
          [ "$py" = "$want" ] && [ "$js" = "$want" ]

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v6

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - name: Build the backend
        run: python scripts/build_backend.py

      - name: Check the backend answers
        run: |
          exe=dist/corpusqa-backend/corpusqa-backend
          [ -f "$exe.exe" ] && exe="$exe.exe"
          printf '{"id":"1","cmd":"config.get"}\n' \
            | "$exe" --config corpusqa.example.yaml > reply.json
          python -c "import json; r = json.loads(open('reply.json').readline()); assert r.get('id') == '1' and 'result' in r, r; print('backend ok')"

      - name: Build the app
        working-directory: gui
        env:
          # No signing certificate: never look for one in the keychain.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm ci
          npx electron-builder --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: corpusqa-${{ matrix.name }}
          path: |
            gui/dist/*.AppImage
            gui/dist/*.deb
            gui/dist/*.exe
            gui/dist/*.dmg
            gui/dist/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    name: Publish the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Checksums
        run: cd assets && sha256sum * | tee SHA256SUMS.txt

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" assets/* \
            --title "corpusqa ${GITHUB_REF_NAME}" \
            --notes-file packaging/release-notes.md
