# corpusqa example configuration.
# Model strings are illustrative -- verify against current LiteLLM provider
# docs (docs.litellm.ai) before use.

providers:
  ollama_local:
    api_base: "http://localhost:11434"
    max_concurrency: 2
  lm_studio:
    kind: lm_studio
    api_base: "http://localhost:1234/v1"
    max_concurrency: 1
  openrouter:
    api_key_env: OPENROUTER_API_KEY
    max_concurrency: 8

tasks:
  catalog_summarize:
    model: "openrouter/anthropic/claude-sonnet-4.5"
    provider: openrouter
    temperature: 0.2
    max_tokens: 800
    context_window: 200000
  query_route:
    model: "openrouter/google/gemini-2.5-flash"
    provider: openrouter
    max_tokens: 4096
    context_window: 1000000
  extract:
    model: "ollama/qwen3:14b"
    provider: ollama_local
    max_tokens: 2048
    context_window: 32768
    # Most document tokens per call. Small models read less carefully than
    # their window holds, so tune this per model (catalog_summarize takes it too);
    # unset fills the window. Compare sizes with: query --section-tokens N
    # max_input_tokens: 4000
    cost_per_mtok_in: 0.0
    cost_per_mtok_out: 0.0
    fallbacks: ["openrouter/deepseek/deepseek-chat"]
    # To run extract on LM Studio instead (load the model with a context at
    # least as large as context_window; LM Studio fixes it at load time):
    # model: "lm_studio/<model-id>"
    # provider: lm_studio
  synthesize:
    model: "openrouter/anthropic/claude-sonnet-4.5"
    provider: openrouter
    max_tokens: 8192
    context_window: 200000

query:
  sweep_threshold: 150   # --mode auto sweeps at or below this many files
  # Group answers (GUI button / `corpusqa summarize`) uses the synthesize task's model.
  group_context_chars: 300   # surrounding text shown with each hit, per side
  group_output_tokens: 2048  # output reserve per grouping call; the rest of the window holds hits

ingest:
  ocr: "off"
  pdf_backend: "docling_parse"   # try "pypdfium" if large PDFs hit std::bad_alloc

budget:
  confirm_above_usd: 1.00
